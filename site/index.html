<style>
:root{--b1:#f7fcfc;--b2:#e4f4f2;--ink:#082a29;--mute:#58787a;--glass:rgba(255,255,255,.55);--edge:rgba(255,255,255,.85);--hi:rgba(255,255,255,.95);--chip:rgba(8,42,41,.06);--acc:#14b8a6;--acc2:#0a7f86;--glow:rgba(34,211,238,.4);--sh:0 16px 36px -16px rgba(8,90,90,.3);--bgd:#f4fafa;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:#061615;--b2:#0a2523;--ink:#e8f8f6;--mute:#86a9a7;--glass:rgba(255,255,255,.07);--edge:rgba(255,255,255,.14);--hi:rgba(255,255,255,.16);--chip:rgba(255,255,255,.08);--sh:0 16px 36px -16px rgba(0,0,0,.7);--bgd:#0a2220;color-scheme:dark}}
:root[data-theme="dark"]{--b1:#061615;--b2:#0a2523;--ink:#e8f8f6;--mute:#86a9a7;--glass:rgba(255,255,255,.07);--edge:rgba(255,255,255,.14);--hi:rgba(255,255,255,.16);--chip:rgba(255,255,255,.08);--sh:0 16px 36px -16px rgba(0,0,0,.7);--bgd:#0a2220;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:linear-gradient(180deg,var(--b1),var(--b2)) fixed;color:var(--ink);font:500 15px/1.4 "Plus Jakarta Sans",system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0}
body::before{width:320px;height:320px;background:#5eead4;opacity:.5;top:-90px;right:-90px}
body::after{width:300px;height:300px;background:#7dd3fc;opacity:.4;bottom:80px;left:-110px}
.app{position:relative;z-index:1;max-width:480px;margin:auto;padding:20px 18px 140px}
.glass{background:var(--glass);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--edge);box-shadow:var(--sh),inset 0 1px 0 var(--hi)}
h1{font-weight:800;font-size:34px;line-height:1.08;letter-spacing:-.03em}
h2{font-weight:800;font-size:19px;letter-spacing:-.02em}
.sub{color:var(--mute);margin-top:6px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;transition:transform .15s}
button:active{transform:scale(.95)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.bar img{width:42px;height:42px;border-radius:12px;box-shadow:0 8px 18px -6px rgba(10,127,134,.6)}
.bar b{font-weight:800;font-size:17px;letter-spacing:-.02em;flex:1}
.streak{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;font-weight:600;font-size:13px}
.streak svg{width:15px;height:15px;fill:#14b8a6}
.top-banner{position:sticky;top:10px;z-index:20;max-width:480px;margin:10px auto 14px;padding:12px 18px;border-radius:24px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 12px 30px -10px rgba(10,127,134,.25)}
.banner-left{display:flex;align-items:center;gap:12px;min-width:0}
.banner-logo{width:38px;height:38px;border-radius:10px;box-shadow:0 6px 14px -4px rgba(10,127,134,.4);flex-shrink:0}
.banner-title{font-weight:800;font-size:15px;letter-spacing:-.02em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner-sub{font-weight:600;font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.apk-badge{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:999px;font-weight:700;font-size:13px;background:linear-gradient(135deg,#14b8a6,#0a7f86);color:#fff!important;text-decoration:none;box-shadow:0 8px 20px -4px rgba(20,184,166,.55),inset 0 1px 0 rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.3);transition:transform .15s,box-shadow .15s;flex-shrink:0}
.apk-badge:hover{transform:translateY(-1px);box-shadow:0 12px 24px -4px rgba(20,184,166,.7)}
.apk-badge svg{width:16px;height:16px;fill:currentColor}
.poster{--a:#0d9488;--b:#134e4a;position:relative;aspect-ratio:3/4;border-radius:30px;padding:14px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;background:linear-gradient(160deg,var(--a),var(--b));border:1px solid rgba(255,255,255,.35);box-shadow:0 22px 38px -16px rgba(6,70,70,.6),inset 0 0 0 1px rgba(255,255,255,.12),inset 0 1px 0 rgba(255,255,255,.5)}
.poster::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 60% at 10% -5%,rgba(255,255,255,.4),transparent 65%),radial-gradient(60% 40% at 100% 100%,rgba(103,232,249,.35),transparent 70%)}
.poster::after{content:"";position:absolute;width:66%;aspect-ratio:1;right:-20%;bottom:-16%;border-radius:50%;border:20px solid rgba(255,255,255,.13);box-shadow:0 0 30px rgba(103,232,249,.35),inset 0 0 20px rgba(103,232,249,.25)}
.poster>*{position:relative;z-index:1}
.sp{position:absolute!important;width:14px;height:14px;background:rgba(255,255,255,.8);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);right:22%;top:34%}
.sp.s2{width:9px;height:9px;right:auto;left:12%;top:44%;opacity:.6}
.pt{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.28);padding:5px 11px;border-radius:999px;font-weight:600;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.pill i{width:7px;height:7px;border-radius:50%;background:#ff3b30;box-shadow:0 0 8px #ff3b30}
.x{margin-left:auto;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.22);font-size:16px;line-height:1}
.poster p{font-weight:800;font-size:19px;line-height:1.12;letter-spacing:-.02em;padding-right:54px;text-wrap:balance;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.pl{position:absolute!important;right:12px;bottom:12px;width:46px;height:46px;border-radius:50%;background:linear-gradient(180deg,#fff,#dff6f3);color:#0a7f86;display:grid;place-items:center;box-shadow:0 8px 18px rgba(0,40,40,.35),0 0 0 4px rgba(255,255,255,.18)}
.pl svg{width:20px;height:20px;fill:currentColor;margin-left:2px}
.car{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:6px 18px 26px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.car .poster{flex:0 0 78%;aspect-ratio:4/5;scroll-snap-align:start;padding:18px;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.car .poster p{font-size:30px;padding-right:70px}
.car .pl{width:58px;height:58px;right:16px;bottom:16px}
.car .pl svg{width:25px;height:25px}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.97)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tlc{border-radius:30px;padding:20px 18px 8px}
.tlh{display:flex;justify-content:space-between;align-items:baseline}
.tlh span{color:var(--mute);font-weight:600;font-size:13px}
.prog{height:6px;border-radius:9px;background:var(--chip);margin:12px 0 6px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#14b8a6,#22d3ee);box-shadow:0 0 12px var(--glow)}
.it{display:grid;grid-template-columns:54px 14px 1fr auto;gap:10px;align-items:center;padding:10px 0}
.it .tm{font-weight:600;font-size:13px;color:var(--mute)}
.rail{align-self:stretch;position:relative;display:flex;justify-content:center}
.rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--chip)}
.rail i{position:relative;align-self:center;width:12px;height:12px;border-radius:50%;background:var(--bgd);border:3px solid var(--acc);box-shadow:0 0 0 4px var(--glow)}
.it.dn .rail i{background:var(--acc);box-shadow:none}
.it .tx{min-width:0;font-weight:600;line-height:1.25}
.it.dn .tx{color:var(--mute);text-decoration:line-through}
.tg{display:flex;align-items:center;gap:6px;font-weight:500;font-size:12px;color:var(--mute);margin-top:3px}
.tg i{width:8px;height:8px;border-radius:50%;background:linear-gradient(160deg,var(--a),var(--b))}
.ac{display:flex;gap:8px}
.ck,.go{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.ck{border:2px solid var(--chip);color:transparent}
.ck svg,.go svg{width:17px;height:17px}
.ck svg{stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.it.dn .ck{background:var(--acc);border-color:var(--acc);color:#fff}
.go{background:linear-gradient(135deg,#14b8a6,#0a7f86);color:#fff;box-shadow:0 6px 14px -4px rgba(10,127,134,.7)}
.go svg{fill:currentColor;margin-left:2px}
.col{display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:28px;width:100%;text-align:left;margin-top:12px}
.fan{position:relative;width:70px;height:78px;flex:none}
.fan i{position:absolute;left:12px;top:6px;width:46px;height:62px;border-radius:12px;background:linear-gradient(160deg,var(--a),var(--b));border:1px solid rgba(255,255,255,.55);box-shadow:0 8px 14px -6px rgba(6,70,70,.5)}
.fan i:nth-child(1){transform:rotate(-14deg) translateX(-8px)}
.fan i:nth-child(2){transform:rotate(12deg) translateX(8px)}
.col .nm{flex:1;min-width:0}
.col b{font-weight:800;font-size:18px;letter-spacing:-.02em;display:block}
.col span{color:var(--mute);font-size:13px}
.col svg{width:20px;height:20px;stroke:var(--mute);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.newc{border:2px dashed var(--edge);background:var(--chip);justify-content:center;font-weight:600;color:var(--mute);padding:18px}
.back{display:inline-flex;gap:6px;align-items:center;padding:10px 16px;border-radius:999px;margin-bottom:18px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.grid>:nth-child(even){margin-top:28px}
.empty{padding:30px 22px;border-radius:28px;text-align:center;color:var(--mute);margin-top:20px}
.empty b{display:block;color:var(--ink);font-weight:800;font-size:19px;margin-bottom:6px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100% - 32px));padding:8px;border-radius:999px;display:flex;align-items:center;justify-content:space-between;z-index:5}
nav .t{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px;border-radius:999px;color:var(--mute);font-size:12px;font-weight:600}
nav .t svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav .t.on{color:var(--acc2);background:var(--chip)}
nav .plus{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,#2dd4bf,#0a7f86);color:#fff;font-size:32px;margin:0 8px;box-shadow:0 10px 26px rgba(20,184,166,.55),inset 0 1px 0 rgba(255,255,255,.5)}
.scrim{position:fixed;inset:0;background:rgba(4,30,30,.4);z-index:8;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(480px,100%);max-height:90vh;overflow:auto;transform:translate(-50%,104%);transition:transform .38s cubic-bezier(.2,.9,.25,1);z-index:9;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));border-radius:34px 34px 0 0;background:var(--b1);border:1px solid var(--edge)}
.sheet.on{transform:translate(-50%,0)}
.grab{width:42px;height:5px;border-radius:9px;background:var(--chip);margin:0 auto 16px}
.prev{display:flex;gap:14px;align-items:stretch}
.prev .poster{width:104px;flex:none;border-radius:22px;padding:9px}
.prev .poster p{font-size:13px;padding-right:0}
.prev .poster::after,.prev .sp,.prev .pl{display:none}
.prev .f{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.lab{font-weight:800;margin:18px 0 8px}
input{width:100%;border:1px solid var(--edge);background:var(--glass);color:var(--ink);border-radius:16px;padding:13px 15px;font:500 15px "Plus Jakarta Sans",sans-serif}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 16px;border-radius:999px;background:var(--chip);font-weight:600;display:inline-flex;align-items:center;gap:8px}
.chip.on{background:var(--ink);color:var(--b1)}
.chip i{width:10px;height:10px;border-radius:50%;background:linear-gradient(160deg,var(--a),var(--b))}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:4px}
.seg button{flex:1;padding:11px;border-radius:999px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--b1);color:var(--acc2);box-shadow:0 3px 10px rgba(0,0,0,.12)}
.dy{display:flex;justify-content:space-between}
.dy button{width:40px;height:40px;border-radius:50%;background:var(--chip);font-weight:600;font-size:13px}
.dy button.on{background:var(--acc2);color:#fff}
.save{width:100%;margin-top:24px;padding:17px;border-radius:999px;background:linear-gradient(135deg,#2dd4bf,#0a7f86);color:#fff;font-weight:800;font-size:16px;box-shadow:0 12px 28px rgba(20,184,166,.5),inset 0 1px 0 rgba(255,255,255,.45)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);background:var(--ink);color:var(--b1);padding:12px 20px;border-radius:999px;font-weight:600;z-index:20;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

function chips(a,k,cur,m){return a.map(function(x){var on=m?cur.indexOf(x)>-1:cur===x;return'<button class="chip'+(on?" on":"")+'" data-k="'+k+'" data-v="'+x+'">'+x+'</button>'}).join("")}
function sheet(){
 var f=F,D=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],q=[["Morning","07:00"],["Midday","12:30"],["Evening","20:00"]];
 var h='<div class="grab"></div><div class="prev">'+poster({id:0,cat:f.cat,note:f.note||"Your note shows here",time:f.time,rep:f.rep,days:f.days})+'<div class="f"><input id="fu" aria-label="Reel link" value="'+esc(f.url)+'"><input id="fn" aria-label="Note" placeholder="Why did you save it?" value="'+esc(f.note)+'"></div></div>';
 h+='<div class="lab">Category</div><div class="chips">'+cats.map(function(c){return'<button class="chip'+(f.cat===c.id?" on":"")+'" style="'+sv(c)+'" data-k="cat" data-v="'+c.id+'"><i></i>'+esc(c.n)+'</button>'}).join("")+'<button class="chip" id="nc">+ New</button></div><div id="ncw"></div>';
 h+='<div class="lab">When</div><div class="chips" style="margin-bottom:10px">'+q.map(function(x){return'<button class="chip'+(f.time===x[1]?" on":"")+'" data-t="'+x[1]+'">'+x[0]+'</button>'}).join("")+'</div><input id="ft" type="time" aria-label="Time" value="'+f.time+'">';
 h+='<div class="lab">Repeat</div><div class="seg">'+["Once","Daily","Weekly"].map(function(x){return'<button class="'+(f.rep===x?"on":"")+'" data-k="rep" data-v="'+x+'">'+x+'</button>'}).join("")+'</div>';
 if(f.rep==="Weekly")h+='<div class="lab">On these days</div><div class="dy">'+D.map(function(d){return'<button class="'+(f.days.indexOf(d)>-1?"on":"")+'" data-k="days" data-v="'+d+'">'+d[0]+'</button>'}).join("")+'</div>';
 h+='<button class="save" id="sv">Save reminder</button>';$("sh").innerHTML=h}
function sync(){if($("fu")){F.url=$("fu").value;F.note=$("fn").value;F.time=$("ft").value||F.time}}
function openS(){F={url:"https://www.instagram.com/reel/Di4nRt6/",note:"",cat:"motivation",rep:"Daily",days:[],time:"07:00"};sheet();$("sc").className="scrim on";$("sh").className="sheet on"}
function closeS(){$("sc").className="scrim";$("sh").className="sheet"}
document.addEventListener("click",function(e){
 var t=e.target.closest("button");if(!t)return;var d=t.dataset,id=t.id;
 if(id==="nA")return openS();
 if(id==="nT"){st={v:"today",c:null,nc:false};return view()}
 if(id==="nV"){st={v:"vault",c:null,nc:false};return view()}
 if(id==="bk"){st.c=null;return view()}
 if(id==="nw"){st.nc=true;view();return $("ncn").focus()}
 if(d.cat){st.c=d.cat;return view()}
 if(d.play)return toast("Opening this exact reel in Instagram");
 if(d.done){reels.forEach(function(r){if(r.id==d.done)r.done=!r.done});toast("Updated");return view()}
 if(d.del){reels=reels.filter(function(r){return r.id!=d.del});toast("Reel removed");return view()}
 if(d.t){sync();F.time=d.t;return sheet()}
 if(id==="nc"){$("ncw").innerHTML='<input id="ncn" placeholder="Name it, then press Enter" style="margin-top:10px">';$("ncn").focus();return}
 if(d.k){sync();if(d.k==="days"){var x=F.days.indexOf(d.v);x>-1?F.days.splice(x,1):F.days.push(d.v)}else F[d.k]=d.v;return sheet()}
 if(id==="sv"){sync();
  if(F.url.indexOf("instagram.com")<0)return toast("Only Instagram links work here");
  if(F.rep==="Weekly"&&!F.days.length)return toast("Pick at least one day");
  reels.push({id:nid++,cat:F.cat,note:F.note||"Your saved reel",rep:F.rep,time:F.time,days:F.days.slice(),done:false});
  closeS();toast("Saved. We’ll remind you at "+fmt(F.time));view()}
});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="ncn"&&e.target.value.trim()){var n=e.target.value.trim(),p=[["#0e7490","#164e63"],["#0284c7","#0c4a6e"],["#16a34a","#14532d"]][cats.length%3],inS=$("sh").className.indexOf("on")>-1;if(inS)sync();cats.push({id:n.toLowerCase().replace(/\W+/g,"-"),n:n,a:p[0],b:p[1]});if(inS){F.cat=cats[cats.length-1].id;sheet()}else{st.nc=false;view()}}});
document.addEventListener("input",function(e){if(e.target.id==="fn"||e.target.id==="ft"){var s=e.target.selectionStart,i=e.target.id;sync();sheet();var el=$(i);el.focus();try{el.setSelectionRange(s,s)}catch(x){}}});
$("sc").addEventListener("click",closeS);
view();
</script></body></html>
