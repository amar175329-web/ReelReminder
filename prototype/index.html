  case"done":r.done=!r.done;closeS();toast(r.done?"Marked as watched":"Marked as not watched");return view();
  case"pause":r.paused=!r.paused;closeS();toast(r.paused?"Reminders paused":"Reminders resumed");return view();
  case"del":lastDel=r;reels=reels.filter(function(x){return x.id!==r.id});closeS();toast("Reel deleted",1);return view();
  case"pick":sync();F.cov=(F.cov+1)%COV.length;return form();
  case"nocov":sync();F.cov=-1;return form();
  case"nc":sync();$("ncw").innerHTML='<input id="ncn" placeholder="Name it, then press Enter" style="margin-top:10px">';return $("ncn").focus();
  case"pdate":sync();return openCal("date");
  case"pend":sync();return openCal("endDate");
  case"ptime":sync();return openTime();
  case"cm":P.m+=+d.v;if(P.m<0){P.m=11;P.y--}if(P.m>11){P.m=0;P.y++}return calS();
  case"cy":P.y+=+d.v;return calS();
  case"cd":P.sel=d.v;return calS();
  case"calok":F[P.tg]=P.sel;P.open=false;return form();
  case"calx":P.open=false;return form();
  case"th":P.h=+d.v;return timeS();
  case"tmi":P.mi=+d.v;return timeS();
  case"tap":P.ap=d.v;return timeS();
  case"tok":F.time=pad((P.h%12)+(P.ap==="pm"?12:0))+":"+pad(P.mi);P.open=false;return form();
  case"ev":F.every=Math.max(1,(+F.every||1)+(+d.v));return form();
  case"save":return save();
  case"cmenu":return cmenu();
  case"cren":var nm=$("cn").value.trim();if(nm){cat(st.c).n=nm}closeS();toast("Renamed");return view();
  case"cdel":return cdel();
  case"cdgo":var cid=st.c;if(d.m==="move")reels.forEach(function(x){if(x.cat===cid)x.cat=M});else reels=reels.filter(function(x){return x.cat!==cid});cats=cats.filter(function(x){return x.id!==cid});st.c=null;closeS();toast("Collection deleted");return view();
 }
});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="ncn"&&e.target.value.trim()){var n=e.target.value.trim(),p=[["#0e7490","#164e63"],["#0284c7","#0c4a6e"],["#16a34a","#14532d"]][cats.length%3],inS=$("sh").className.indexOf("on")>-1;if(inS)sync();cats.push({id:n.toLowerCase().replace(/\W+/g,"-")+cats.length,n:n,a:p[0],b:p[1]});if(inS){F.cat=cats[cats.length-1].id;form()}else{st.nc=false;view()}}});
["input","change"].forEach(function(ev){document.addEventListener(ev,function(e){if(/^(fu|fn|fec)$/.test(e.target.id))refresh()})});
$("sc").addEventListener("click",function(){if(P.open){P.open=false;form()}else closeS()});
view();
</script></body></html>
